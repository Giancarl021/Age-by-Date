<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/vite.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Idade pela data</title>
        <script type="module" src="/src/main.ts"></script>
    </head>
    <body>
        <header>
            <h1>Idade pela data</h1>
        </header>
        <main>
            <div id="input">
                <input type="text" id="date" data-display-name="dia" />
                <input type="text" id="month" data-display-name="mês" />
                <input type="text" id="year" data-display-name="ano" />
            </div>
            <div id="info"><ul id="validation-errors"></ul></div>
            <div id="output" class="hidden">
                <span id="years"></span>
                <span id="months"></span>
                <span id="days"></span>
            </div>
        </main>
    </body>
</html>
